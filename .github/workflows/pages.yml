# Publishes the site to GitHub Pages on every push to main.
# It also copies index.html into menu/ so www.laescala.eu/menu/ works.
# To give another page its own address, add it to PAGE_URLS in index.html
# and add its name to PAGES below.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  PAGES: "menu"

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site folder
        run: |
          mkdir -p _site
          find . -maxdepth 1 -type f ! -name 'README.md' -exec cp {} _site/ \;
          for p in $PAGES; do
            mkdir -p "_site/$p"
            cp index.html "_site/$p/index.html"
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
